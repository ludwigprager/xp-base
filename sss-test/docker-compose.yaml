services:

  s1:
    container_name: s1
    image: nginx
# s2:
#   container_name: s2
#   image: nginx

  nginx:
    container_name: nginx
    image: nginx
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:80"]
        interval: 30s
        timeout: 10s
        retries: 5
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

