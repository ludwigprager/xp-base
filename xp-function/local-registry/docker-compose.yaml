services:
  registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5001:5000"   # Exposed on host port 5001
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - ./registry-data:/var/lib/registry
    restart: unless-stopped


  proxy:
    image: nginx:alpine
    container_name: registry-proxy
    depends_on:
      - registry
    ports:
#     - "80:80"       # Expose portless FQDN via standard HTTPS port
      - "443:443"       # Expose portless FQDN via standard HTTPS port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/registry.g1.crt:/etc/ssl/certs/registry.g1.crt:ro
      - ./certs/registry.g1.key:/etc/ssl/private/registry.g1.key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped




  # Docker-in-Docker builder
  builder:
#   image: docker:24-dind
    build:
      context: ./container/builder
      dockerfile: Dockerfile
#     image: builder:local          # Optional: gives the built image a name
    container_name: builder
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=""
#   command: ["--insecure-registry", "registry.g1:5000"]
    volumes:
      - ../:/work   # Workspace for builds
      - ./dind-data:/var/lib/docker
      - ./certs:/etc/docker/certs.d:ro
#     - ./daemon.json:/etc/docker/daemon.json:ro  # Mount insecure registry config
      - ./certs:/etc/docker/certs.d:ro  # CA trust directory
    working_dir: /work
    stdin_open: true
    tty: true
    restart: unless-stopped
    extra_hosts:
      - "registry.g1:host-gateway"

