apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvpn.xp.celp.de
spec:
  group: xp.celp.de
  names:
    kind: xvpn
    plural: xvpns
    shortNames: [xv]
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                names:
                  type: array
                  items:
                    type: string
              required:
                - region
                - names
      additionalPrinterColumns:
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Count
          type: integer
          jsonPath: .spec.names | length

